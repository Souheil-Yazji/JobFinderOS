# JobScoutOS master scheduler — due windows. Regenerated by
# scripts/JobScoutOS_install_launchd.sh (env: JOBS_DAILY_*, MARK_WEEKLY_*,
# WATCH_*, SCHEDULER_INTERVAL_SECONDS, JOBSCOUTOS_TZ). Edit by hand if you like.
#
# Watch job (invoked each scheduler tick; the guard enforces watch.hour on weekdays):
#   jobscoutos_priority_watch.py → /jobs-priority-watch

start_interval_seconds: 1800

# IANA timezone for all windows (empty = the Mac's local time)
timezone: ""

daily:
  hour: 7
  minute: 0

weekly:
  weekday: 1     # launchd convention: 0 = Sunday, 1 = Monday
  hour: 8
  minute: 0

watch:
  hour: 9
  minute: 0
